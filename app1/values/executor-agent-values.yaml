fullnameOverride: executor-agent
replicaCount: 1

image:
  repository: "610156625646.dkr.ecr.ap-south-1.amazonaws.com/highradius-poc/fintech-agent"
  tag: v2
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: regcred

container:
  name: executor-agent
  port: 8080

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []

httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: shared-gateway
      namespace: gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /executor-agent
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: executor-agent
          port: 80

workflow:
  enabled: false
