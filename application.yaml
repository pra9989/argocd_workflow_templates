apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-workflow-template
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/YOUR-USER/YOUR-REPO.git
    targetRevision: main
    path: argo-workflows

  destination:
    name: gke-crossplane-cluster
    namespace: argo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
